<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة جداً 🌸</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fbf6f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* شاشة قفل كلمة المرور */
        #lock-screen {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 360px;
        }

        #lock-screen h2 {
            color: #b38b82;
            margin-bottom: 10px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        #lock-screen p.intro-text {
            color: #8e7f70;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        #lock-screen input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6dfd5;
            border-radius: 25px;
            font-size: 0.95rem;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            background: #faf8f5;
        }

        #lock-screen button {
            background: #e3c4be;
            color: #5a4f43;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }

        #lock-screen button:hover {
            background: #edd6d2;
        }

        #error-msg {
            color: #c97d73;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* الكارت الرئيسي هيكل ثابت ومغلق */
        #content-screen {
            display: none;
            position: relative;
            background: #ffffff;
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            width: 92%;
            max-width: 380px;
            height: 600px; /* ارتفاع ثابت كلياً للحاوية */
            z-index: 5;
            animation: fadeIn 0.8s ease-in-out forwards;
            border: 1px solid #f3ece4;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* مشغل الأغنية */
        .music-player {
            background: #fcf8f5;
            border: 1px solid #f0e6dd;
            border-radius: 20px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .album-art {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #e3c4be;
            background-size: cover;
            animation: rotateArt 8s linear infinite paused;
            flex-shrink: 0;
        }

        @keyframes rotateArt {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-title {
            font-size: 0.8rem;
            color: #5a4f43;
            margin: 0;
            font-weight: bold;
            text-align: right;
        }

        .song-time {
            font-size: 0.7rem;
            color: #a39688;
            margin: 0;
            text-align: right;
        }

        .player-controls button {
            background: #edd6d2;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: #5a4f43;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        /* العدادات */
        .counters-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .counters-container {
            background: #fff8f6;
            border-radius: 15px;
            padding: 8px;
            border: 1px solid #f7ece9;
            text-align: center;
        }

        .counter-title {
            font-size: 0.8rem;
            color: #b38b82;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        .counter-grid {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .counter-box {
            background: #fdf1ee;
            border-radius: 10px;
            padding: 5px 4px;
            width: 52px;
            text-align: center;
            box-shadow: 0 2px 4px rgba(227,196,190,0.15);
        }

        .counter-num {
            font-size: 1rem;
            font-weight: bold;
            color: #b38b82;
            display: block;
            line-height: 1;
        }

        .counter-label {
            font-size: 0.6rem;
            color: #8e7f70;
        }

        /* صندوق النص معزول بـ Position Absolute ليضمن انعدام أي حركة للواجهة */
        #text-container {
            position: absolute;
            top: 275px;
            bottom: 65px;
            left: 15px;
            right: 15px;
            color: #5a4f43;
            font-size: 0.95rem;
            line-height: 1.6;
            text-align: justify;
            overflow-y: auto;
            padding: 10px;
            background: #faf8f5;
            border-radius: 15px;
            border: 1px dashed #efe6dc;
        }

        #text-container::-webkit-scrollbar {
            width: 4px;
        }
        #text-container::-webkit-scrollbar-thumb {
            background: #edd6d2;
            border-radius: 10px;
        }

        /* الزرار ثابت في الأسفل تماماً */
        .btn-wrapper {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
        }

        .next-btn {
            background: #edd6d2;
            color: #5a4f43;
            border: none;
            padding: 10px 0;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
            transition: background 0.3s;
            width: 100%;
        }

        .next-btn:hover {
            background: #e3c4be;
        }

        .rose-petal {
            position: absolute;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 999;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="song.mp3" loop preload="auto"></audio>

    <!-- 1. شاشة كلمة المرور -->
    <div id="lock-screen">
        <h2>مرحباً يا جمِيلتي 🩵 ✨</h2>
        <p class="intro-text">في مفاجأة حلوة مستنياك هنا.. بس عشان تفتح، محتاجة التاريخ السرّي الخاص بينا 🩵</p>
        <input type="text" id="password-input" placeholder="اكتبي التاريخ السرّي...">
        <button onclick="checkPassword()">ادخلي لعالمنا الصغير 🩵</button>
        <p id="error-msg">التاريخ غلط، حاولي تاني يا عسل! 🌸</p>
    </div>

    <!-- 2. الكارت الرئيسي -->
    <div id="content-screen">
        
        <!-- مشغل الأغنية -->
        <div class="music-player">
            <div class="player-info">
                <div class="album-art" id="album-art" style="background-image: url('https://cdn-icons-png.flaticon.com/512/3211/3211394.png');"></div>
                <div class="song-details">
                    <p class="song-title">عمرو دياب - وإنت معايا 😍</p>
                    <p class="song-time" id="track-time">0:00</p>
                </div>
            </div>
            <div class="player-controls">
                <button id="play-btn" onclick="toggleMusic()">⏸</button>
            </div>
        </div>
        
        <!-- العدادات -->
        <div class="counters-wrapper">
            <div class="counters-container">
                <p class="counter-title">🩵 بدايتنا سوا (شهر 2 - 2025) 🩵</p>
                <div class="counter-grid" id="love-start-counter">
                    <div class="counter-box"><span class="counter-num" id="d1">0</span><span class="counter-label">يوم</span></div>
                    <div class="counter-box"><span class="counter-num" id="h1">0</span><span class="counter-label">ساعة</span></div>
                    <div class="counter-box"><span class="counter-num" id="m1">0</span><span class="counter-label">دقيقة</span></div>
                    <div class="counter-box"><span class="counter-num" id="s1">0</span><span class="counter-label">ثانية</span></div>
                </div>
            </div>

            <div class="counters-container">
                <p class="counter-title">🩵 يوم ما قلتلك بحبك (17-03-2025) 🩵</p>
                <div class="counter-grid" id="confession-counter">
                    <div class="counter-box"><span class="counter-num" id="d2">0</span><span class="counter-label">يوم</span></div>
                    <div class="counter-box"><span class="counter-num" id="h2">0</span><span class="counter-label">ساعة</span></div>
                    <div class="counter-box"><span class="counter-num" id="m2">0</span><span class="counter-label">دقيقة</span></div>
                    <div class="counter-box"><span class="counter-num" id="s2">0</span><span class="counter-label">ثانية</span></div>
                </div>
            </div>
        </div>
        
        <!-- مساحة الكتابة المعزولة تماماً -->
        <div id="text-container"></div>
        
        <!-- زر التالي -->
        <div class="btn-wrapper">
            <button class="next-btn" onclick="nextText()">التالي ←</button>
        </div>
    </div>

    <script>
        function normalizeDigits(str) {
            return str.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        }

        const dateLoveStart = new Date(2025, 1, 1); 
        const dateConfession = new Date(2025, 2, 17); 

        const paragraphs = [
            "🩵 داير أقول ليك إنك ما مجرد بت بحبها إنتِ الحياة الكنت بحلم بيها من زمان وإنتِ الحلم الصحيت ولقيتو قدامي وإنتِ الأمان الارتاح فيهو قلبي والدفا البحسو كل يوم 🩵 إنتِ أجمل من أي كلام ممكن يتقال وأحن من أي حضن كنت بتخيلو 🩵",
            "إنتِ ما بس حبيبتي إنتِ دنيتي كلها وإنتِ روحي ونصيبي وأجمل هدية ربنا رزقني بيها 🩵 من أول يوم عرفتك فيهو وأنا بقيت زول تاني الضحكة بقت من القلب والدنيا بقت أحلى وفيها أمل 🩵",
            "متذكرة الأيام القضيتها معاك هناك؟ الأيام القليلة دي كانت أحلى لحظات في حياتي كلها، حسيت فيها بالجد إننا لبعض ومستحيل نفترق 🩵",
            "متذكرة يوم مشينا البنك الصباح؟ وطلعنا اتمشينا شوية وكنا بنتونس والجو كان مغيم شديد وجميل؟ ديك كانت لحظات ما بتتنسى أبداً 🩵",
            "أجمل إحساس في الدنيا لما كنت ماسك يدك وإحنا ماشين سوا.. إحساس دافئ ومطمئن خلاني أعرف قد شنو أنا بحبك وبخاف عليك 🩵",
            "بقيت أصحى وأنا مبسوط عشان إنتِ في حياتي وبقيت أحب الأيام البتمرق وإنتِ فيها 🩵 بقيت أفرح بالحاجات البسيطة لأن وجودك براهو بكفيني وكل يوم بدعي ربنا يخليكِ لي وما يحرمني منك 🩵",
            "إنتِ غيرتيني للأحسن وعرفتيني معنى الحب الحقيقي 🩵 إنتِ النور الدخل قلبي وما فارقو لمن أشوفك بضحك من غير ما أحس ولمن أسمع صوتك كل التعب البجواي بهدأ 🩵",
            "رسالتك بتفرحني وكلمة وحشتني منك بتخليني أسعد زول في الدنيا 🩵 إنتِ كل حاجة حلوة حصلت لي والزولة البخاف عليها من الهوا والما داير منها غير رضاها وسعادتها 🩵",
            "بحب صوتك وضحكتك وعيونك وطيبة قلبك وحتى زعلك وعصبيتك وبحبك لمن تصالحي وتضحكي بعد الزعل 🩵 بحب غيرتك علي واهتمامك بي وخوفك علي لأن كل حاجة فيك جميلة بالنسبة لي 🩵",
            "إنتِ سبب ضحكتي وسندي وقت التعب وقلبي البيدق عشانك كل ثانية 🩵 إنتِ الفرحة الحقيقية في حياتي والهدية الربنا كتبها لي 🩵",
            "كل يوم بشكر ربنا إنك موجودة في حياتي وكل يوم بحبك أكتر من اليوم القبلو 🩵 وجودك شفا لقلبي وإنتِ الروح السكنت جواي 🩵",
            "إنتِ الحب المستحيل يتكرر وحتى لو الدنيا كلها اتغيرت إنتِ حتفضلي ثابتة جوة قلبي 🩵 إنتِ أول زول بفكر فيهو لمن أصحى وآخر زول بفكر فيهو قبل أنوم 🩵",
            "لو عشت ألف سنة ما حتكفيني أوصف ليك قدر شنو أنا بقيت بحبك 🩵 إنتِ أجمل من كل الكلام وأجمل من كل وصف وإنتِ دنيتي البحمد ربنا عليها كل يوم 🩵",
            "بحبك وحأفضل أحبك وحأفضل أدعي ربنا يجمعني بيك ويخليك لي طول العمر 🩵 وحأفضل أكتب عنك لحدي آخر نفس فيني 🩵",
            "بحبك شديد يا نور عيني ويا أجمل حاجة حصلت لي في حياتي 🩵🩵🩵"
        ];

        let currentParagraphIndex = 0;
        let typingTimeout;

        function checkPassword() {
            let input = document.getElementById("password-input").value.trim();
            input = normalizeDigits(input); 
            const cleanInput = input.replace(/[^0-9]/g, ''); 

            const errorMsg = document.getElementById("error-msg");
            const lockScreen = document.getElementById("lock-screen");
            const contentScreen = document.getElementById("content-screen");
            const music = document.getElementById("bg-music");
            const albumArt = document.getElementById("album-art");

            if (cleanInput === "20260617") {
                lockScreen.style.display = "none";
                contentScreen.style.display = "block";
                
                music.play().then(() => {
                    albumArt.style.animationPlayState = "running";
                    document.getElementById("play-btn").innerText = "⏸";
                }).catch(function(error) {
                    console.log("التحميل التلقائي شغال.");
                });
                
                startTyping(paragraphs[currentParagraphIndex]);
                startRoseRain();
                updateTimer();
                
                setInterval(calculateCounters, 1000);
            } else {
                errorMsg.style.display = "block";
            }
        }

        function calculateCounters() {
            const now = new Date();

            let diff1 = now - dateLoveStart;
            document.getElementById("d1").innerText = Math.floor(diff1 / (1000 * 60 * 60 * 24));
            document.getElementById("h1").innerText = Math.floor((diff1 / (1000 * 60 * 60)) % 24);
            document.getElementById("m1").innerText = Math.floor((diff1 / 1000 / 60) % 60);
            document.getElementById("s1").innerText = Math.floor((diff1 / 1000) % 60);

            let diff2 = now - dateConfession;
            document.getElementById("d2").innerText = Math.floor(diff2 / (1000 * 60 * 60 * 24));
            document.getElementById("h2").innerText = Math.floor((diff2 / (1000 * 60 * 60)) % 24);
            document.getElementById("m2").innerText = Math.floor((diff2 / 1000 / 60) % 60);
            document.getElementById("s2").innerText = Math.floor((diff2 / 1000) % 60);
        }

        function startTyping(text) {
            const container = document.getElementById("text-container");
            container.innerHTML = "";
            let i = 0;
            clearTimeout(typingTimeout);

            function type() {
                if (i < text.length) {
                    container.innerHTML += text.charAt(i);
                    i++;
                    typingTimeout = setTimeout(type, 35);
                }
            }
            type();
        }

        function nextText() {
            if (currentParagraphIndex < paragraphs.length - 1) {
                currentParagraphIndex++;
            } else {
                currentParagraphIndex = 0;
            }
            startTyping(paragraphs[currentParagraphIndex]);
        }

        function toggleMusic() {
            const music = document.getElementById("bg-music");
            const playBtn = document.getElementById("play-btn");
            const albumArt = document.getElementById("album-art");

            if (music.paused) {
                music.play();
                playBtn.innerText = "⏸";
                albumArt.style.animationPlayState = "running";
            } else {
                music.pause();
                playBtn.innerText = "▶";
                albumArt.style.animationPlayState = "paused";
            }
        }

        function updateTimer() {
            const music = document.getElementById("bg-music");
            const timeDisplay = document.getElementById("track-time");
            setInterval(() => {
                if (!music.paused) {
                    let current = Math.floor(music.currentTime);
                    let min = Math.floor(current / 60);
                    let sec = current % 60;
                    timeDisplay.innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
                }
            }, 1000);
        }

        function startRoseRain() {
            const petals = ['🩵', '💙', '✨', '🩵', '💎'];
            setInterval(() => {
                const petal = document.createElement('div');
                petal.classList.add('rose-petal');
                petal.innerText = petals[Math.floor(Math.random() * petals.length)];
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = Math.random() * 3 + 2 + 's';
                petal.style.fontSize = Math.random() * 10 + 15 + 'px';
                document.body.appendChild(petal);
                setTimeout(() => { petal.remove(); }, 5000);
            }, 450);
        }
    </script>
</body>
</html>
